name: Runner Security Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-check:
    runs-on: self-hosted

    steps:
      # Always use minimum permissions on self-hosted runners
      - name: Security message
        run: echo "Security check started"

      - name: Check user
        run: whoami

      - name: Check machine
        run: hostname

      - name: Check folder
        run: pwd
